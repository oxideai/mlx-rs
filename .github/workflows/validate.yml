name: validate
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: blaze/macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # verify-oracle-boundary --base walks the commit range; a shallow
          # clone has no history to walk.
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo --version
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      # Oracle trust boundary: implementation changes may not alter goldens,
      # policies, or comparator logic in the same change set (VERIFICATION.md,
      # "Anti-self-oracle rules"). Working-tree integrity always; range check
      # on PRs.
      - run: cargo run -p xtask -- verify-oracle-boundary
        if: github.event_name != 'pull_request'
      - run: cargo run -p xtask -- verify-oracle-boundary --base ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'
      - run: cargo run -p xtask -- verify-ledger

  ffi-gate:
    runs-on: blaze/macos-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/guard-malloc/target
      MLX_RS_METAL_PATH: ${{ runner.temp }}/guard-malloc/metallib
      TMPDIR: ${{ runner.temp }}
      GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Locate build cache
        id: ffi-cache
        run: echo "target=$(python3 -c 'import os; print(os.path.relpath(os.environ["CARGO_TARGET_DIR"]))')" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-gate-${{ hashFiles('Cargo.toml', '*/Cargo.toml') }}
          workspaces: . -> ${{ steps.ffi-cache.outputs.target }}
          cache-directories: ${{ runner.temp }}/guard-malloc/metallib
      - name: Qualify leaks and Guard Malloc
        timeout-minutes: 75
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ffi-gate"
          cargo run -p xtask -- verify-ffi --calibrate --guard-malloc \
            --budget-seconds 3600 --leaks-timeout-seconds 600 \
            --guard-malloc-timeout-seconds 1200 \
            --report "$RUNNER_TEMP/ffi-gate/verify-ffi.json" \
            2> >(tee "$RUNNER_TEMP/ffi-gate/stderr.log" >&2) \
            | tee "$RUNNER_TEMP/ffi-gate/calibration.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-ffi-calibration
          path: ${{ runner.temp }}/ffi-gate/

  tests:
    runs-on: blaze/${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-latest]
        rust: [1.88.0, stable]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: ${{ matrix.rust }}
          rustflags: "" # Disable when we're ready
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}-${{ matrix.runner }}-${{ hashFiles('Cargo.toml', '*/Cargo.toml') }}
      - run: cargo test --all -- --test-threads=1 # MLX is not thread safe

  tests-cpu-only:
    runs-on: blaze/macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: stable
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-only-stable-macos-latest-${{ hashFiles('Cargo.toml', '*/Cargo.toml') }}
      - run: cargo test -p mlx-rs -p mlx-tests --no-default-features --features accelerate -- --test-threads=1
