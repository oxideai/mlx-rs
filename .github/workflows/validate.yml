name: validate
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: blaze/macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # verify-oracle-boundary --base walks the commit range; a shallow
          # clone has no history to walk.
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo --version
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      # Oracle trust boundary: implementation changes may not alter goldens,
      # policies, or comparator logic in the same change set (VERIFICATION.md,
      # "Anti-self-oracle rules"). Working-tree integrity always; range check
      # on PRs.
      - run: cargo run -p xtask -- verify-oracle-boundary
        if: github.event_name != 'pull_request'
      - run: cargo run -p xtask -- verify-oracle-boundary --base ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'
      - run: cargo run -p xtask -- verify-ledger

  ffi-gate:
    runs-on: blaze/macos-latest
    timeout-minutes: 90
    env:
      GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The runner context is not available in job-level env.
      - name: Use the runner temp dir for build output
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/guard-malloc/target"
            echo "MLX_RS_METAL_PATH=$RUNNER_TEMP/guard-malloc/metallib"
            echo "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Locate build cache
        id: ffi-cache
        run: echo "target=$(python3 -c 'import os; print(os.path.relpath(os.environ["CARGO_TARGET_DIR"]))')" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-gate-${{ hashFiles('Cargo.toml', '*/Cargo.toml') }}
          workspaces: . -> ${{ steps.ffi-cache.outputs.target }}
          cache-directories: ${{ runner.temp }}/guard-malloc/metallib
      - name: Qualify leaks and Guard Malloc
        timeout-minutes: 75
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ffi-gate"
          cargo run -p xtask -- verify-ffi --calibrate --guard-malloc \
            --budget-seconds 3600 --leaks-timeout-seconds 600 \
            --guard-malloc-timeout-seconds 1200 \
            --report "$RUNNER_TEMP/ffi-gate/verify-ffi.json" \
            2> >(tee "$RUNNER_TEMP/ffi-gate/stderr.log" >&2) \
            | tee "$RUNNER_TEMP/ffi-gate/calibration.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-ffi-calibration
          path: ${{ runner.temp }}/ffi-gate/

  tests:
    runs-on: blaze/${{ matrix.runner }}
    env:
      GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    strategy:
      matrix:
        runner: [macos-latest]
        rust: [1.88.0, stable]
        include:
          - rust: 1.88.0
            configuration: macos-arm64-default-msrv
          - rust: stable
            configuration: macos-arm64-default
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set configuration output paths
        id: config-cache
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/config-targets/${{ matrix.configuration }}"
            echo "MLX_RS_METAL_PATH=$RUNNER_TEMP/config-metallib/${{ matrix.configuration }}"
          } >> "$GITHUB_ENV"
          echo "target=$(python3 -c 'import os; print(os.path.relpath(os.environ["RUNNER_TEMP"] + "/config-targets/${{ matrix.configuration }}"))')" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: ${{ matrix.rust }}
          rustflags: "" # Disable when we're ready
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}-${{ matrix.runner }}-${{ hashFiles('Cargo.toml', '*/Cargo.toml') }}
          workspaces: . -> ${{ steps.config-cache.outputs.target }}
          cache-directories: ${{ env.MLX_RS_METAL_PATH }}
      - run: cargo run -p xtask -- config-report ${{ matrix.configuration }} --report "$RUNNER_TEMP/config-reports/${{ matrix.configuration }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-report-${{ matrix.configuration }}
          path: ${{ runner.temp }}/config-reports/
      - name: Set macos-arm64-metal-jit output paths
        if: ${{ !cancelled() && matrix.rust == 'stable' }}
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/config-targets/macos-arm64-metal-jit"
            echo "MLX_RS_METAL_PATH=$RUNNER_TEMP/config-metallib/macos-arm64-metal-jit"
          } >> "$GITHUB_ENV"
      - run: cargo run -p xtask -- config-report macos-arm64-metal-jit --report "$RUNNER_TEMP/config-reports/macos-arm64-metal-jit.json"
        if: ${{ !cancelled() && matrix.rust == 'stable' }}
      - uses: actions/upload-artifact@v4
        if: always() && matrix.rust == 'stable'
        with:
          name: config-report-macos-arm64-metal-jit
          path: ${{ runner.temp }}/config-reports/macos-arm64-metal-jit.*

  tests-cpu-only:
    runs-on: blaze/macos-latest
    env:
      GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set configuration output paths
        id: config-cache
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/config-targets/macos-arm64-cpu-only"
            echo "MLX_RS_METAL_PATH=$RUNNER_TEMP/config-metallib/macos-arm64-cpu-only"
          } >> "$GITHUB_ENV"
          echo "target=$(python3 -c 'import os; print(os.path.relpath(os.environ["RUNNER_TEMP"] + "/config-targets/macos-arm64-cpu-only"))')" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: stable
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-only-stable-macos-latest-${{ hashFiles('Cargo.toml', '*/Cargo.toml') }}
          workspaces: . -> ${{ steps.config-cache.outputs.target }}
          cache-directories: ${{ env.MLX_RS_METAL_PATH }}
      - run: cargo run -p xtask -- config-report macos-arm64-cpu-only --report "$RUNNER_TEMP/config-reports/macos-arm64-cpu-only.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-report-macos-arm64-cpu-only
          path: ${{ runner.temp }}/config-reports/
      - name: Set macos-arm64-cpu-only-release output paths
        if: ${{ !cancelled() }}
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/config-targets/macos-arm64-cpu-only-release"
            echo "MLX_RS_METAL_PATH=$RUNNER_TEMP/config-metallib/macos-arm64-cpu-only-release"
          } >> "$GITHUB_ENV"
      - run: cargo run --release -p xtask -- config-report macos-arm64-cpu-only-release --report "$RUNNER_TEMP/config-reports/macos-arm64-cpu-only-release.json"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-report-macos-arm64-cpu-only-release
          path: ${{ runner.temp }}/config-reports/macos-arm64-cpu-only-release.*
